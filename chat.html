<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roomverse - Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .chat-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 350px;
            background-color: #f0f2f5;
            border-right: 1px solid #e2e8f0;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #e5ddd5;
        }

        .chat-header {
            background-color: #fff;
            border-bottom: 1px solid #e2e8f0;
        }

        .message-history {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .my-message {
            background-color: #dcf8c6;
            border-radius: 0.5rem;
        }

        .other-message {
            background-color: #fff;
            border-radius: 0.5rem;
        }

        .message-input-area {
            background-color: #f0f2f5;
            border-top: 1px solid #e2e8f0;
        }

        .contact-list-item:hover {
            background-color: #e8eaf6;
            cursor: pointer;
        }
    </style>
</head>

<body class="bg-gray-100">

    <div class="chat-container">
        <div class="sidebar flex flex-col">
            <div class="p-4 bg-white border-b border-gray-200 flex items-center justify-between">
                <h1 class="text-2xl font-bold text-gray-800">Chats</h1>
            </div>
            <div class="p-4">
                <input type="text" id="search-bar" placeholder="Search or start a new chat"
                    class="w-full px-4 py-2 rounded-lg bg-gray-200 border border-gray-300 focus:outline-none focus:ring focus:ring-indigo-200">
            </div>
            <div id="contact-list" class="overflow-y-auto flex-1">
            </div>
        </div>

        <div class="chat-area hidden md:flex flex-col">
            <div id="chat-placeholder" class="flex flex-col items-center justify-center h-full text-gray-500">
                <svg class="w-16 h-16 text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z">
                    </path>
                </svg>
                <p class="text-lg font-medium">Select a chat to start messaging</p>
            </div>

            <div id="active-chat-window" class="hidden h-full flex flex-col">
                <div class="chat-header p-4 flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                        <img id="chat-partner-profile-pic" src="user.png" alt="Profile"
                            class="w-10 h-10 rounded-full object-cover">
                        <div>
                            <p id="chat-partner-name" class="font-semibold text-lg text-gray-800">User Name</p>
                            <!-- <span id="chat-partner-status" class="text-sm text-gray-500">Online</span> -->
                        </div>
                    </div>
                    <div class="relative group">
                        <button
                            class="text-gray-500 hover:text-gray-700 p-2 rounded-full hover:bg-gray-100 transition-colors">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z">
                                </path>
                            </svg>
                        </button>
                        <div
                            class="absolute right-0 mt-2 w-48 bg-white border border-gray-200 rounded-lg shadow-lg hidden group-hover:block group-focus-within:block">
                            <button
                                class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Report</button>
                            <button
                                class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50">Block</button>
                        </div>
                    </div>
                </div>

                <div id="message-history" class="message-history flex-1 flex flex-col space-y-4 p-4">
                </div>

                <div class="message-input-area p-4 flex items-center space-x-2">
                    <button id="emoji-btn"
                        class="text-gray-500 hover:text-gray-700 p-2 rounded-full hover:bg-gray-100">😊</button>
                    <input type="text" id="message-input" placeholder="Type a message..."
                        class="flex-1 px-4 py-2 rounded-full bg-white border border-gray-300 focus:outline-none">
                    <button id="send-btn" class="bg-indigo-600 text-white p-2 rounded-full hover:bg-indigo-700">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M5 12h14M12 5l7 7-7 7"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./firebase.js"></script>
    <script type="module" src="./chat.js"></script>

</body>

</html>
